name: Pull Request CI

on:
  pull_request:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Local quality contract
    runs-on: ubuntu-latest
    env:
      VITE_ALGOLIA_APP_ID: ${{ vars.ALGOLIA_APP_ID }}
      VITE_ALGOLIA_SEARCH_KEY: ${{ vars.ALGOLIA_SEARCH_KEY }}
      VITE_ALGOLIA_INDEX: ${{ vars.ALGOLIA_INDEX }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bun run typecheck

      - name: Unit and integration tests
        run: bun run test

      - name: Production engine build
        run: bun run build

      - name: Self-hosted docs build
        run: bun run docs:build

  browser-ssr:
    name: Browser and SSR smoke test
    runs-on: ubuntu-latest
    env:
      VITE_ALGOLIA_APP_ID: ${{ vars.ALGOLIA_APP_ID }}
      VITE_ALGOLIA_SEARCH_KEY: ${{ vars.ALGOLIA_SEARCH_KEY }}
      VITE_ALGOLIA_INDEX: ${{ vars.ALGOLIA_INDEX }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build self-hosted docs
        run: bun run docs:build

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run browser and SSR smoke test
        run: bun run test:browser

  generated-consumer:
    name: Generated consumer smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build local package
        run: bun run build

      - name: Run generated consumer smoke test
        run: bun run test:generated

  package:
    name: Package validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate package artifact
        run: bun run package:check

  static:
    name: Static and bundle checks
    runs-on: ubuntu-latest
    env:
      VITE_ALGOLIA_APP_ID: ${{ vars.ALGOLIA_APP_ID }}
      VITE_ALGOLIA_SEARCH_KEY: ${{ vars.ALGOLIA_SEARCH_KEY }}
      VITE_ALGOLIA_INDEX: ${{ vars.ALGOLIA_INDEX }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check diff whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"

      - name: Validate bundle sizes
        run: bun run bundle:check

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check dependency changes
        uses: actions/dependency-review-action@v5

  netlify-preview:
    name: Netlify preview deploy
    needs: [quality, browser-ssr, generated-consumer, package, static]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      VITE_ALGOLIA_APP_ID: ${{ vars.ALGOLIA_APP_ID }}
      VITE_ALGOLIA_SEARCH_KEY: ${{ vars.ALGOLIA_SEARCH_KEY }}
      VITE_ALGOLIA_INDEX: ${{ vars.ALGOLIA_INDEX }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build preview site
        run: bun run docs:build

      - name: Deploy preview when Netlify credentials are configured
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "Netlify preview skipped: repository secrets are not configured."
            exit 0
          fi
          npx --yes netlify-cli@17.36.1 deploy \
            --dir=.docs-dist \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --alias="pr-${{ github.event.pull_request.number }}"
